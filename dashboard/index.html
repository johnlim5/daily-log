<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>達成度ダッシュボード - Mainichi Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #f3f4f6;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="min-h-screen bg-gray-100">
  <div id="app" class="max-w-md mx-auto px-4 py-6"></div>

  <script>
    const API_BASE = "https://my-gemini-worker.01-yen-ambient.workers.dev";

    // --- Utility ---
    function startOfDay(date) {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function formatDate(date) {
      const m = date.getMonth() + 1;
      const d = date.getDate();
      return `${m}/${d}`;
    }

    function dayLabel(date) {
      return ["日", "月", "火", "水", "木", "金", "土"][date.getDay()];
    }

    function getWeekDays(referenceDate) {
      const today = startOfDay(referenceDate);
      const dayOfWeek = today.getDay(); // 0=Sun
      const monday = new Date(today);
      monday.setDate(today.getDate() - ((dayOfWeek + 6) % 7));
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        days.push(d);
      }
      return days;
    }

    // --- Achievement Logic ---
    // For a given day, check which categories (Morning/Afternoon/Evening) have at least one completion
    function computeDayAchievement(routines, logs, date) {
      const dayStart = startOfDay(date).getTime();
      const dayEnd = dayStart + 24 * 60 * 60 * 1000;

      const dayLogs = logs.filter(l => l.timestamp >= dayStart && l.timestamp < dayEnd);
      const completedRoutineIds = new Set(dayLogs.map(l => l.routineId));

      const categoriesWithRoutines = new Set();
      const categoriesCompleted = new Set();

      for (const r of routines) {
        const cat = r.category || "Morning";
        categoriesWithRoutines.add(cat);
        if (completedRoutineIds.has(r.id)) {
          categoriesCompleted.add(cat);
        }
      }

      const total = categoriesWithRoutines.size;
      const done = categoriesCompleted.size;

      if (total === 0) return { mark: "-", done: 0, total: 0, categories: {} };

      let mark;
      if (done >= 2) mark = "\u25cb";      // ○
      else if (done === 1) mark = "\u25b3"; // △
      else mark = "\u00d7";                 // ×

      const categories = {};
      for (const cat of ["Morning", "Afternoon", "Evening"]) {
        if (!categoriesWithRoutines.has(cat)) {
          categories[cat] = null; // no routines in this category
        } else {
          categories[cat] = categoriesCompleted.has(cat);
        }
      }

      return { mark, done, total, categories };
    }

    function markColor(mark) {
      if (mark === "\u25cb") return "text-green-600";
      if (mark === "\u25b3") return "text-yellow-500";
      if (mark === "\u00d7") return "text-red-400";
      return "text-gray-300";
    }

    function markBg(mark) {
      if (mark === "\u25cb") return "bg-green-50 border-green-200";
      if (mark === "\u25b3") return "bg-yellow-50 border-yellow-200";
      if (mark === "\u00d7") return "bg-red-50 border-red-200";
      return "bg-gray-50 border-gray-200";
    }

    const catLabel = { Morning: "朝", Afternoon: "昼", Evening: "夜" };
    const catIcon = { Morning: "☀️", Afternoon: "🌤", Evening: "🌙" };

    // --- Rendering ---
    function renderApp(routines, logs) {
      const app = document.getElementById("app");
      const today = new Date();
      const todayAchievement = computeDayAchievement(routines, logs, today);

      // Week offset navigation
      const weekOffset = parseInt(new URLSearchParams(location.search).get("w") || "0");
      const refDate = new Date(today);
      refDate.setDate(refDate.getDate() + weekOffset * 7);
      const weekDays = getWeekDays(refDate);

      const weekAchievements = weekDays.map(d => ({
        date: d,
        ...computeDayAchievement(routines, logs, d),
      }));

      const circleCount = weekAchievements.filter(a => a.mark === "\u25cb").length;
      const isCurrentWeek = weekOffset === 0;
      const todayStr = startOfDay(today).getTime();

      app.innerHTML = `
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
          <a href="/daily-log/" class="text-sm text-slate-500 hover:text-slate-700 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            戻る
          </a>
          <h1 class="text-lg font-semibold text-slate-800">達成度</h1>
          <div class="w-12"></div>
        </div>

        <!-- Today's Achievement -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-5">
          <div class="text-xs text-slate-400 mb-2 font-medium">今日の達成度</div>
          <div class="flex items-center gap-4">
            <div class="text-5xl font-bold ${markColor(todayAchievement.mark)}">${todayAchievement.mark}</div>
            <div class="flex-1">
              <div class="flex gap-3">
                ${["Morning", "Afternoon", "Evening"].map(cat => {
                  const status = todayAchievement.categories[cat];
                  if (status === null) return "";
                  const done = status === true;
                  return `
                    <div class="flex items-center gap-1 text-sm ${done ? "text-slate-700" : "text-slate-300"}">
                      <span>${catIcon[cat]}</span>
                      <span class="font-medium">${catLabel[cat]}</span>
                      ${done ? '<span class="text-green-500">&#10003;</span>' : '<span class="text-slate-300">&mdash;</span>'}
                    </div>
                  `;
                }).join("")}
              </div>
              <div class="text-xs text-slate-400 mt-2">
                ${todayAchievement.done}/${todayAchievement.total} カテゴリ完了
              </div>
            </div>
          </div>
        </div>

        <!-- Weekly Calendar -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-5">
          <div class="flex items-center justify-between mb-4">
            <button onclick="navigateWeek(${weekOffset - 1})" class="p-1 text-slate-400 hover:text-slate-700">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
              </svg>
            </button>
            <div class="text-xs font-medium text-slate-500">
              ${formatDate(weekDays[0])} 〜 ${formatDate(weekDays[6])}
            </div>
            <button onclick="navigateWeek(${weekOffset + 1})" class="p-1 text-slate-400 hover:text-slate-700 ${weekOffset >= 0 ? 'invisible' : ''}">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </button>
          </div>

          <div class="grid grid-cols-7 gap-2">
            ${weekAchievements.map(a => {
              const isToday = startOfDay(a.date).getTime() === todayStr;
              const isFuture = startOfDay(a.date).getTime() > todayStr;
              const mark = isFuture ? "-" : a.mark;
              return `
                <div class="flex flex-col items-center gap-1">
                  <div class="text-[10px] font-medium ${isToday ? 'text-blue-600' : 'text-slate-400'}">${dayLabel(a.date)}</div>
                  <div class="w-10 h-10 rounded-xl border flex items-center justify-center text-lg font-bold
                    ${isToday ? 'ring-2 ring-blue-400 ring-offset-1' : ''}
                    ${isFuture ? 'bg-gray-50 border-gray-100' : markBg(mark)}
                    ${markColor(mark)}">
                    ${isFuture ? "" : mark}
                  </div>
                  <div class="text-[10px] ${isToday ? 'text-blue-600 font-semibold' : 'text-slate-400'}">${formatDate(a.date)}</div>
                </div>
              `;
            }).join("")}
          </div>

          <!-- Week summary -->
          <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-center gap-2">
            <span class="text-sm text-slate-500">今週の</span>
            <span class="text-lg font-bold text-green-600">\u25cb</span>
            <span class="text-sm text-slate-700 font-semibold">${circleCount}<span class="text-slate-400 font-normal"> / 7 日</span></span>
          </div>
        </div>

        <!-- Legend -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4">
          <div class="text-xs text-slate-400 mb-2 font-medium">判定基準</div>
          <div class="flex justify-around text-sm">
            <div class="flex items-center gap-1.5">
              <span class="text-lg font-bold text-green-600">\u25cb</span>
              <span class="text-slate-600">2〜3カテゴリ</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-lg font-bold text-yellow-500">\u25b3</span>
              <span class="text-slate-600">1カテゴリ</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-lg font-bold text-red-400">\u00d7</span>
              <span class="text-slate-600">0カテゴリ</span>
            </div>
          </div>
        </div>
      `;
    }

    function navigateWeek(offset) {
      if (offset > 0) return; // Don't go into the future
      const url = new URL(location.href);
      if (offset === 0) {
        url.searchParams.delete("w");
      } else {
        url.searchParams.set("w", offset);
      }
      history.pushState(null, "", url);
      loadAndRender();
    }

    // --- Data Loading ---
    function showLogin() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="flex flex-col items-center justify-center min-h-[60vh]">
          <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 w-full max-w-xs">
            <h2 class="text-center text-lg font-semibold text-slate-700 mb-4">パスワード</h2>
            <input id="pw" type="password" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 mb-3" placeholder="パスワードを入力" />
            <button onclick="doLogin()" class="w-full bg-slate-800 text-white rounded-lg py-2 text-sm font-medium hover:bg-slate-700 transition">ログイン</button>
            <div id="login-error" class="text-red-500 text-xs text-center mt-2 hidden">認証に失敗しました</div>
          </div>
        </div>
      `;
      document.getElementById("pw").addEventListener("keydown", e => {
        if (e.key === "Enter") doLogin();
      });
    }

    async function doLogin() {
      const pw = document.getElementById("pw").value;
      if (!pw) return;
      localStorage.setItem("app_password", pw);
      const ok = await loadAndRender();
      if (!ok) {
        document.getElementById("login-error").classList.remove("hidden");
        localStorage.removeItem("app_password");
      }
    }

    async function loadAndRender() {
      const password = localStorage.getItem("app_password");
      if (!password) {
        showLogin();
        return false;
      }

      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="flex items-center justify-center min-h-[40vh]">
          <div class="text-slate-400 text-sm">読み込み中...</div>
        </div>
      `;

      try {
        const res = await fetch(`${API_BASE}/data`, {
          headers: { "X-App-Password": password, "Content-Type": "application/json" },
        });
        if (res.status === 401) {
          localStorage.removeItem("app_password");
          showLogin();
          return false;
        }
        const data = await res.json();
        renderApp(data.routines || [], data.logs || []);
        return true;
      } catch (e) {
        app.innerHTML = `
          <div class="flex flex-col items-center justify-center min-h-[40vh] gap-3">
            <div class="text-red-400 text-sm">通信エラー</div>
            <button onclick="loadAndRender()" class="text-sm text-slate-500 underline">再試行</button>
          </div>
        `;
        return false;
      }
    }

    // Handle browser back/forward
    window.addEventListener("popstate", () => loadAndRender());

    // Init
    loadAndRender();
  </script>
</body>
</html>
